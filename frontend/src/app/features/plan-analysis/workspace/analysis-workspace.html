<div class="aw">
  <!-- Navigation breadcrumb -->
  <header class="aw__nav">
    <button class="aw__back-btn" (click)="goBack()">
      <ng-icon name="heroArrowLeft" size="16" />
      <span>Planning</span>
    </button>
    <span class="aw__nav-sep">/</span>
    <span class="aw__nav-current">Analysis</span>
  </header>

  @if (emptyState() === 'not-available') {
    <div class="aw__empty">
      <ng-icon name="heroChartBar" size="40" />
      <p class="aw__empty-text">
        Compilá un plan en <strong>Planning</strong> para empezar el análisis.
      </p>
    </div>
  } @else if (emptyState() === 'not-analyzed') {
    <div class="aw__empty">
      <p class="aw__empty-text">
        Este plan no se ha analizado aún.
      </p>
      <button class="aw__btn aw__btn--action" (click)="onAnalyze()">
        Analizar plan
      </button>
    </div>
  } @else {
    <!-- Ready — status banner + problem regions + inspector -->
    <status-banner />
    <problem-regions />
    @if (selectedRegionId() !== null) {
      <region-inspector />
    } @else {
      <div class="aw__ready">
        <p class="aw__placeholder-text">
          Select a region to inspect.
        </p>
      </div>
    }
  }
</div>
