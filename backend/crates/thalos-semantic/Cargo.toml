[package]
name = "thalos_semantic"
version = "0.1.0"
edition = "2024"

[features]
# Test support: shared canonical-scenario helpers used by the pipeline e2e
# regression tests (ir_properties.rs, e2e_canonical_pipeline.rs, and the
# runtime e2e_execution.rs). NOT in default — production builds must not
# compile test helpers into the shipped lib/binaries. The test targets that
# need it declare `required-features = ["test-support"]`.
test-support = []

[[test]]
name = "ir_properties"
required-features = ["test-support"]

[[test]]
name = "e2e_canonical_pipeline"
required-features = ["test-support"]

[dependencies]
thalos_core = { path = "../thalos-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
# I2 end-to-end origin-preservation tests drive the full canonical pipeline
# (SemanticLowering → MotionResolver → PlanCompiler) from the semantic crate.
thalos-planning = { path = "../thalos-planning" }
