[package]
name = "thalos_api"
version = "0.1.0"
edition = "2024"

[dependencies]
thalos_core = { path = "../thalos-core" }
thalos_models = { path = "../thalos-models" }
thalos_visual = { path = "../thalos-visual" }
thalos_runtime = { path = "../thalos-runtime" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
