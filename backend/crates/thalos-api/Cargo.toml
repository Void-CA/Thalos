[package]
name = "thalos_api"
version = "0.1.0"
edition = "2024"

[dependencies]
thalos_core = { path = "../thalos-core" }
thalos_math = { path = "../thalos-math" }
thalos_models = { path = "../thalos-models" }
thalos-planning = { path = "../thalos-planning" }
thalos_visual = { path = "../thalos-visual" }
thalos_runtime = { path = "../thalos-runtime" }
thalos-intelligence = { path = "../thalos-intelligence" }
thalos-collision = { path = "../thalos-collision" }
thalos-optimization = { path = "../thalos-optimization" }
thalos_semantic = { path = "../thalos-semantic" }
thalos-document = { path = "../thalos-document" }
hex = "0.4"
sha2 = "0.10"
axum = {version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# R4-002: the no_firmware-over-real-serial integration test opens a virtual
# serial pair (SerialStream::pair) whose slave path is a real /dev/pts/N.
tokio-serial = "5"
