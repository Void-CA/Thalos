[package]
name = "thalos_runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
thalos_core = { path = "../thalos-core" }
thalos_math = { path = "../thalos-math" }
thalos_models = { path = "../thalos-models" }
thalos-planning = { path = "../thalos-planning" }
thalos-collision = { path = "../thalos-collision" }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tokio = { version = "1", features = ["sync", "rt", "macros", "net", "io-util", "fs"] }
tokio-serial = "5"
async-trait = "0.1"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
