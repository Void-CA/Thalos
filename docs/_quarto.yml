project:
  type: book

book:
  title: "Thalos — Documentación Técnica"
  subtitle: "Plataforma modular para modelado, análisis y visualización de sistemas robóticos"
  author: "Thalos Team"
  date: today
  language: es
  search: true
  repo-url: https://github.com/Void-CA/Thalos
  page-navigation: true
  
  chapters:
    - index.qmd
    - vision.qmd
    - architecture.qmd
    - workspace.qmd
    - domain.qmd
    - flow.qmd
    - maturity.qmd
    - contributing.qmd

  appendices:
    - glossary.qmd

bibliography: refs.bib

format:
  html:
    theme:
      - cosmo
      - custom.scss
    code-copy: true
    code-fold: false
    toc: true
    toc-depth: 3
    number-sections: true
  pdf:
    documentclass: scrreprt
    toc: true
    toc-depth: 3
    number-sections: true
