; Thalos ESP32 Execution Backend
; PlatformIO build configuration
; Target: ESP32-S3 with Arduino framework

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Build flags
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0

; Serial monitor settings
monitor_filters =
    esp32_exception_decoder

; ── Host tests (no hardware required) ──────────────────────────────────────
; Builds src/protocol.cpp, src/validator.cpp and src/executor.cpp against the
; Arduino stubs in test/test_protocol/stubs and runs Unity invariants tests.
; main.cpp (Arduino entry points) is excluded via build_src_filter.

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -I src
    -I test/test_protocol/stubs
build_src_filter =
    +<*>
    -<main.cpp>
